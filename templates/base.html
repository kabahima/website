<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}Ernest Kabahima{% endblock %}</title>
	<style>
		:root{--ink:#102321;--paper:#f7faf9;--mint:#b8e6c1;--orange:#ef704d;--line:#d7ded5;--muted:#64716d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,sans-serif}a{color:inherit}.wrap{max-width:1160px;margin:auto;padding:0 22px}header{border-bottom:1px solid var(--line)}nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}.logo{font-weight:800;text-decoration:none}.logo span{color:var(--orange)}nav a{text-decoration:none}.nav-links{display:flex;gap:18px;font-size:13px}.mono{font-family:monospace;font-size:12px;text-transform:uppercase;letter-spacing:1px}.hero{padding:96px 0 80px;border-bottom:1px solid var(--line)}h1{font-size:clamp(42px,7vw,78px);line-height:.98;letter-spacing:-3px;margin:20px 0}h2{font-size:32px;line-height:1.1}.eyebrow{color:#be5538}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}.item{border:1px solid var(--line);padding:22px;background:white}.muted{color:var(--muted)}.button{display:inline-block;background:var(--ink);color:white;padding:11px 16px;text-decoration:none;border:0}.button.alt{background:var(--mint);color:var(--ink)}form{display:grid;gap:10px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);font:inherit;background:white}textarea{min-height:120px}label{font-size:13px;font-weight:700}.flash{padding:12px 16px;margin:18px 0;background:var(--mint)}.flash.error{background:#ffd9d0}.danger{background:#ffd9d0;color:var(--ink);border:0;padding:7px 10px}.stack{display:grid;gap:26px;padding:48px 0 80px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}.article-body{max-width:760px;margin:0 auto}.article-body p{margin-bottom:1.5em;line-height:1.8}.article-body h1,.article-body h2,.article-body h3{margin:1.5em 0 0.75em}.article-body ul,.article-body ol{margin:1em 0;padding-left:2em}.article-body a{color:var(--orange);text-decoration:underline}.article-body pre{background:#1a1a2e;border-radius:8px;padding:16px;overflow-x:auto;margin:1.5em 0;border:1px solid var(--line)}.article-body code{background:#f1f5f2;border-radius:4px;padding:2px 6px;font-size:0.9em}.article-body pre code{background:none;padding:0;font-size:inherit}.hljs{background:#1a1a2e;color:#e0e0e0}@media(max-width:700px){.nav-links{display:none}.grid,.form-grid{grid-template-columns:1fr}.hero{padding:64px 0 50px}}
	</style>
</head>
<body>
<header><nav class="wrap"><a class="logo" href="/">ernest<span>●</span>kabahima</a><div class="nav-links"><a href="/">Portfolio</a><a href="/journal">Journal</a>{% if session.get('admin_authenticated') %}<a href="/manage">Manage</a>{% endif %}</div></nav></header>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="wrap"><div class="flash {{ category }}">{{ message }}</div></div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</body>
</html>
